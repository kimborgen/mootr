info:
  title: stam daemon API
  version: 0.1.0
  description: |
    The contract of the stam daemon's HTTP API (S-2194 plan, section 3). It describes what the TypeScript daemon does today; a shape that breaks a codegen rule is kept and marked `x-legacy`. Split by family: `paths/` holds one path item per file, `schemas/` one schema per file. `api/openapi.bundled.yaml` is the generated single-file form the code generators read (`node scripts/api-gen.mjs`).
servers:
  - url: http://127.0.0.1:7878
security:
  - bearer: []
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Daemon health, polled by peers and the deploy watcher.
      responses:
        "200":
          description: The daemon is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/agents:
    get:
      operationId: listAgents
      tags:
        - agents
      summary: The agents on this machine and its peers, with the extras the web tree shows; live agents unless state or ids asks for others (S-3816).
      parameters:
        - name: state
          in: query
          description: A comma list of lifecycle groups to list (live is active or paused, stopped is shut down, archived, all). Without it (or empty), and without ids, the list is live agents only; an unknown group is a 400.
          schema:
            type: string
        - name: ids
          in: query
          description: Agent ids or names, comma-separated, added in any state. Without state, the list is only these.
          schema:
            type: string
        - name: q
          in: query
          description: Keeps agents matching the text.
          schema:
            type: string
        - name: role
          in: query
          description: Keeps agents whose role or name contains the text, standing agents first.
          schema:
            type: string
        - name: as
          in: query
          description: The agent whose visibility scopes the list.
          schema:
            type: string
      responses:
        "200":
          description: A bare array, not an envelope. Each row sends `first_prompt` as null; the agent's detail (GET /api/agents/{id}) carries it (S-3808).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/mail-titles:
    post:
      operationId: mailTitlesShown
      tags:
        - mail
      summary: The mails the human's view shows; a stale title or summary is queued to be asked again, and the answer comes at once (S-1843).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  description: Mail ids, the first shown first; only the first 40 are looked at.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
      responses:
        "200":
          description: Whether titles are on (a model set), and the mails still being asked, so the view asks again until they land.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailTitlesShown"
        "400":
          description: ids is not a list of mail ids of at most 200 characters each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not the human's view (an agent's token, a peer, the OpenCode server).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
