type: object
additionalProperties: false
description: >
  One row of `GET /api/agents`: the `agents` table row plus the extras the daemon adds for the web tree.
  A peer's agents come through the same shape. JSON columns travel as strings (x-legacy).
  `token_hash` (the launch-token hash) is removed on purpose (x-removed S-2519): no daemon serves it, and
  the closed object makes the contract test fail if one does.
# The nullable enums list null so ajv accepts it (OpenAPI 3.0.3); the generated `NullPlaceholder` constant
# (value "<nil>") is never used: a JSON null decodes to a nil pointer.
x-removed:
  token_hash: S-2519
required:
  - id
  - name
  - role
  - machine
  - harness
  - model
  - effort
  - cwd
  - parent_id
  - session_id
  - transcript_path
  - lifecycle
  - activity
  - activity_detail
  - context_tokens
  - context_window
  - workspace
  - personal_workspace
  - standing
  - pending_action
  - idle_since
  - idle_notified
  - context_level
  - tokens_after_compaction
  - capabilities
  - permission_mode
  - permission_source
  - visibility
  - child_notices
  - last_message
  - first_prompt
  - usage_last
  - kind
  - type
  - paused_by
  - forwarded_to
  - created_at
  - updated_at
  - parents
  - unread
  - cost_usd
  - cost
  - pending_requests
  - chief_of_staff
  - blockers
  - waits
  - resting
  - in_itsa
  - view
  - default_view
properties:
  id:
    type: string
  name:
    type: string
  role:
    type: string
  machine:
    type: string
  harness:
    type: string
  model:
    type: string
    nullable: true
  effort:
    type: string
    nullable: true
  cwd:
    type: string
  parent_id:
    type: string
    nullable: true
  session_id:
    type: string
    nullable: true
  transcript_path:
    type: string
    nullable: true
  lifecycle:
    type: string
    enum: [active, paused, shut_down, archived]
  activity:
    type: string
    enum: [starting, working, waiting, blocked, errored, idle, unknown]
  activity_detail:
    type: string
    nullable: true
  context_tokens:
    type: integer
    nullable: true
  context_window:
    type: integer
    nullable: true
  workspace:
    type: string
    nullable: true
    description: JSON, how the workspace was made (src/workspace.ts).
    x-legacy: a JSON document inside a string column
  personal_workspace:
    type: string
    nullable: true
  standing:
    type: integer
    enum: [0, 1]
  pending_action:
    type: string
    nullable: true
    x-legacy: a JSON document inside a string column
  idle_since:
    type: string
    nullable: true
  idle_notified:
    type: string
    nullable: true
  context_level:
    type: integer
  tokens_after_compaction:
    type: integer
    nullable: true
  capabilities:
    type: string
    nullable: true
    x-legacy: a JSON document inside a string column
  permission_mode:
    type: string
    enum: [default, auto, bypass]
  permission_source:
    type: string
    nullable: true
    enum: [settings, manual, null]
    x-enum-varnames: [Settings, Manual, NullPlaceholder]
  visibility:
    type: string
    nullable: true
    x-legacy: a JSON document inside a string column
  child_notices:
    type: string
    nullable: true
    enum: [turn, tree-idle, none, null]
    x-enum-varnames: [Turn, TreeIdle, None, NullPlaceholder]
  last_message:
    type: string
    nullable: true
  first_prompt:
    type: string
    nullable: true
  usage_last:
    type: string
    nullable: true
    x-legacy: a JSON document inside a string column
  kind:
    type: string
    nullable: true
    description: '`assistant` for the human''s executive assistant, else null.'
  type:
    type: string
    nullable: true
    description: The agent type it was spawned as (agent-types.ts).
  paused_by:
    type: string
    nullable: true
    x-legacy: a JSON array inside a string column
  forwarded_to:
    type: string
    nullable: true
  created_at:
    type: string
  updated_at:
    type: string
  parents:
    type: array
    description: Ids of every parent, not only `parent_id`.
    items:
      type: string
  unread:
    type: integer
  cost_usd:
    type: number
    format: double
  cost:
    $ref: '#/components/schemas/AgentCost'
  cost_raw:
    $ref: '#/components/schemas/AgentRaw'
  pending_requests:
    type: integer
  chief_of_staff:
    type: boolean
  blockers:
    type: array
    items:
      $ref: '#/components/schemas/AgentBlocker'
  waits:
    type: array
    items:
      $ref: '#/components/schemas/AgentWait'
  resting:
    $ref: '#/components/schemas/AgentResting'
  in_itsa:
    type: boolean
  view:
    type: object
    nullable: true
    additionalProperties: false
    description: What stam's own view of the conversation offers.
    required: [can_stream, can_send, can_interrupt, can_approve]
    properties:
      can_stream:
        type: boolean
      can_send:
        type: boolean
      can_interrupt:
        type: boolean
      can_approve:
        type: boolean
  default_view:
    type: string
    nullable: true
    enum: [terminal, conversation, null]
    x-enum-varnames: [Terminal, Conversation, NullPlaceholder]
  load:
    $ref: '#/components/schemas/AgentLoad'
