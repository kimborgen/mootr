type: object
additionalProperties: false
required: [ok, machine, release, stalls, memory, caches]
properties:
  ok:
    type: boolean
    enum: [true]
  machine:
    type: string
  release:
    type: string
    nullable: true
    description: The release sha the daemon runs; null when it does not run from a release (a test daemon).
  stalls:
    type: array
    description: The last event-loop stalls (src/stall.ts).
    items:
      type: object
      additionalProperties: false
      required: [at, ms, label]
      properties:
        at:
          type: string
          format: date-time
        ms:
          type: integer
        label:
          type: string
  memory:
    type: object
    additionalProperties: false
    description: The daemon's process.memoryUsage(), in bytes.
    required: [heapUsed, heapTotal, rss, external]
    properties:
      heapUsed:
        type: integer
      heapTotal:
        type: integer
      rss:
        type: integer
      external:
        type: integer
      anon:
        type: integer
        description: The resident anonymous pages (RssAnon, S-4390); absent where /proc/self/status isn't there.
      file:
        type: integer
        description: The resident file-backed pages (RssFile, S-4390); absent where /proc/self/status isn't there.
  caches:
    type: object
    additionalProperties: false
    description: What the daemon keeps in memory, counted, read-only (src/daemon.ts).
    required: [activityStats, humanPeers, dbConnections, stalls]
    properties:
      activityStats:
        type: integer
        description: Entries in the activity stats memo.
      humanPeers:
        type: integer
        description: Entries in the human peer memo.
      dbConnections:
        type: integer
        description: Open database connections, the main one and the OpenCode databases.
      stalls:
        type: integer
        description: Event-loop stalls kept in memory (the same list as `stalls`).
